name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Install & Boot Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check server boots without crashing
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE: 7d
          CLIENT_URL: http://localhost:5173
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACEHUB_API_KEY: ${{ secrets.HUGGINGFACEHUB_API_KEY }}
          CHROMA_URL: http://localhost:8000
        run: |
          timeout 15s node server.js &
          SERVER_PID=$!
          sleep 8
          if curl -f http://localhost:5001/api/health; then
            echo "Server booted successfully"
            kill $SERVER_PID
            exit 0
          else
            echo "Server failed to respond on /api/health"
            kill $SERVER_PID
            exit 1
          fi

  frontend:
    name: Frontend - Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://placeholder-api-url.com/api
        run: npm run build